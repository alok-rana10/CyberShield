# ==============================================================================
# CyberShield — Render Blueprint Infrastructure as Code
# Official deployment specification for Render.com
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

databases:
  - name: cybershield-db
    databaseName: cybershield
    user: cybershield
    region: oregon
    plan: free

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + Uvicorn + Alembic + SQLAlchemy)
  # ----------------------------------------------------------------------------
  - type: web
    name: cybershield-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: CyberShield
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: SCAN_ALLOWED_TARGETS
        value: "127.0.0.1,localhost,::1"
      - key: FIM_ALLOWED_ROOTS
        value: "./monitored,./data"
      - key: LOG_ALLOWED_ROOTS
        value: "./logs,./data/logs"

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React 18 + TypeScript + Vite + Tailwind CSS)
  # ----------------------------------------------------------------------------
  - type: web
    name: cybershield-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
